<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420" role="img" aria-labelledby="title desc">
<title id="title">Сохранение двух файлов</title>
<desc id="desc">Сохраните .p12 и .mobileprovision в приложении «Файлы», в разделе «На моём iPhone». Это упрощённая схема, расположение элементов в приложении может отличаться.</desc>

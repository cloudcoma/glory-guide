<path d="M44 101H436" fill="none" stroke="#dce6f3" stroke-width="2"/>
<path d="M53 126h25l13 13v36h-38Z" fill="#e9f2ff" stroke="#1769ed" stroke-width="2.5" stroke-linejoin="round"/><path d="M78 126v13h13m-29 11h19m-19 10h13" fill="none" stroke="#1769ed" stroke-width="2.5" stroke-linecap="round"/><text x="110" y="156" font-size="32" fill="#17243b" font-weight="600" text-anchor="start">.p12</text><path d="M53 190h25l13 13v36h-38Z" fill="#e9f2ff" stroke="#1769ed" stroke-width="2.5" stroke-linejoin="round"/><path d="M78 190v13h13m-29 11h19m-19 10h13" fill="none" stroke="#1769ed" stroke-width="2.5" stroke-linecap="round"/><text x="110" y="220" font-size="29" fill="#17243b" font-weight="600" text-anchor="start">.mobileprovision</text><path d="M240 242v22m-9-9 9 9 9-9" fill="none" stroke="#1769ed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="284" width="400" height="64" rx="18" fill="#1769ed" stroke="none" stroke-width="2"/><text x="240" y="326" font-size="29" fill="#fff" font-weight="600" text-anchor="middle">На моём iPhone</text>
